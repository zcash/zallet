[package]
name = "zallet-zebra"
version = "0.1.0-beta.3"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
]
edition = "2024"
rust-version = "1.95"
description = "A prototype wallet. Don't rely on this for privacy or with significant funds yet!"
repository = "https://github.com/zcash/zallet"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
publish = false

# This package is deliberately its own workspace root with its own lockfile, so its
# zebra-* dependency versions can move independently of the other workspaces
# (librocksdb-sys's `links = "rocksdb"` forbids two zebra-state versions in one
# resolution graph). See https://github.com/zcash/zallet/issues/540.
[workspace]

[[test]]
name = "cli_tests"
required-features = ["zcashd-import"]

[[test]]
name = "zallet_acceptance"
path = "tests/acceptance.rs"

[dependencies]
zallet-core = { path = "../../zallet-core" }

base64 = "0.22"
futures = "0.3"
hex = "0.4"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
orchard = "0.16"
sapling = { package = "sapling-crypto", version = "0.9" }
serde = { version = "1", features = ["serde_derive"] }
jsonrpsee = { version = "0.24", features = ["async-client"] }
jsonrpsee-http-client = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tower = { version = "0.4", features = ["timeout"] }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.1" }
zcash_client_backend = "=0.25.0-pre.1"
zcash_primitives = "=0.31.0-pre.1"
zcash_protocol = "=0.11.0-pre.0"
zebra-chain = "14"
zebra-rpc = "18"
zebra-state = { version = "15", features = ["indexer"] }

[dev-dependencies]
abscissa_core = { version = "0.9", features = ["testing"] }
age = { version = "0.12", features = ["armor", "cli-common", "plugin"] }
once_cell = "1.2"
regex = "1.4"
tempfile = "3"
trycmd = "0.15"

[features]
default = ["spend-index"]

## Per-outpoint transparent spend detection via Zebra's spend index; always enabled
## for this backend (the cfg exists so the sources track zallet-core's API shape).
spend-index = ["zallet-core/spend-index"]

## Allows `zallet` to import zcashd wallets.
zcashd-import = ["zallet-core/zcashd-import"]

## `zallet rpc` CLI support.
rpc-cli = ["zallet-core/rpc-cli"]

## `tokio-console` support.
tokio-console = ["zallet-core/tokio-console"]

[patch.crates-io]
# Use libc++ when requested by the StageX musl builder. This upstream fix landed
# after rocksdb 0.24.0 and can return to crates.io with the next release.
librocksdb-sys = { git = "https://github.com/rust-rocksdb/rust-rocksdb.git", rev = "0442de85de82234643b5ba0a8f66a13ecf31b17d" }

# TEMPORARY: take zewif-zcashd on the -pre.1 NU7 librustzcash cohort
# (zcash/zewif-zcashd#39) until it is merged and released. Every workspace must
# carry the same revision.
zewif-zcashd = { git = "https://github.com/zcash/zewif-zcashd.git", rev = "26d8045ce28d98b36dba8da815d45dee5ca5a90f" }

# TEMPORARY: take the Zebra 7 crates from a commit that moves them to the -pre.1
# NU7 librustzcash cohort (zodl-inc/zebra#30, upstreamed as
# ZcashFoundation/zebra#11614). The released crates pin `zcash_primitives =
# "=0.31.0-pre.0"`, which cannot share a graph with 0.31.0-pre.1. Every crate
# from the Zebra repository in this graph is patched, so that all of them come
# from one commit. Return to crates.io once a Zebra release takes -pre.1.
tower-batch-control = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
tower-fallback = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-chain = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-consensus = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-network = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-node-services = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-rpc = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-script = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }
zebra-state = { git = "https://github.com/zodl-inc/zebra.git", rev = "524922b06f646d9433bed259b6de52dddac9bcf1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tokio_unstable)',
    'cfg(zallet_build, values("merchant_terminal", "wallet"))',
    'cfg(zcash_unstable, values("nu7"))',
] }
