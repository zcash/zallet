[package]
name = "zallet-zebra"
version = "0.1.0-beta.2"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
]
edition = "2024"
rust-version = "1.95"
description = "A prototype wallet. Don't rely on this for privacy or with significant funds yet!"
repository = "https://github.com/zcash/zallet"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
publish = false

# This package is deliberately its own workspace root with its own lockfile, so its
# zebra-* dependency versions can move independently of the zaino backend's
# (librocksdb-sys's `links = "rocksdb"` forbids two zebra-state versions in one
# resolution graph). See https://github.com/zcash/zallet/issues/540.
[workspace]

[[test]]
name = "cli_tests"
required-features = ["zcashd-import"]

[[test]]
name = "zallet_acceptance"
path = "tests/acceptance.rs"

[dependencies]
zallet-core = { path = "../../zallet-core" }

base64 = "0.22"
futures = "0.3"
hex = "0.4"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
orchard = "0.15.0"
sapling = { package = "sapling-crypto", version = "0.7" }
serde = { version = "1", features = ["serde_derive"] }
jsonrpsee = { version = "0.24", features = ["async-client"] }
jsonrpsee-http-client = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tower = { version = "0.4", features = ["timeout"] }
transparent = { package = "zcash_transparent", version = "0.10.0" }
zcash_client_backend = "=0.24.0-rc.7"
zcash_primitives = "0.30.0"
zcash_protocol = "0.10.0"
zebra-chain = "11"
zebra-rpc = "15"
zebra-state = { version = "12", features = ["indexer"] }

[dev-dependencies]
abscissa_core = { version = "0.9", features = ["testing"] }
age = { version = "0.12", features = ["armor", "cli-common", "plugin"] }
once_cell = "1.2"
regex = "1.4"
tempfile = "3"
trycmd = "0.15"

[features]
default = ["spend-index"]

## Per-outpoint transparent spend detection via Zebra's spend index; always enabled
## for this backend (the cfg exists so the sources track zallet-core's API shape).
spend-index = ["zallet-core/spend-index"]

## Allows `zallet` to import zcashd wallets.
zcashd-import = ["zallet-core/zcashd-import"]

## `zallet rpc` CLI support.
rpc-cli = ["zallet-core/rpc-cli"]

## `tokio-console` support.
tokio-console = ["zallet-core/tokio-console"]

[patch.crates-io]
# Use libc++ when requested by the StageX musl builder. This upstream fix landed
# after rocksdb 0.24.0 and can return to crates.io with the next release.
librocksdb-sys = { git = "https://github.com/rust-rocksdb/rust-rocksdb.git", rev = "0442de85de82234643b5ba0a8f66a13ecf31b17d" }

# TEMPORARY: pin the wallet-critical librustzcash crates to the branch adding
# `WalletWrite::import_standalone_transparent_address` (zcash/librustzcash#2941),
# which `zallet import-address` uses to track watch-only transparent addresses
# imported without key material. The full in-repo dependency closure of the two
# client crates is patched to the same rev so the whole cohort resolves from a
# single source. Repoint at crates.io once the change lands in a release.
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
f4jumble = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_pool_migration = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }
zip321 = { git = "https://github.com/zcash/librustzcash.git", rev = "375fc8e51acb2903777f3512bf92b28dc0ac42ef" }

# TEMPORARY: pin the zebra crates to a branch that hardens
# `zebra_rpc::sync::TrustedChainSync` against zebrad dropping the
# `non_finalized_state_change` stream during large initial sends
# (ZcashFoundation/zebra#11265): catch up over unary `get_block` calls before
# every (re)subscription, back off between re-subscription attempts, and keep
# the finalized-tip fallback alive until the first successful commit. The
# branch is `zallet/zebra-rpc-15-sync-hardening`, based on the commit the
# crates.io versions this workspace already uses were published from, so only
# zebra-rpc's code actually changes; the whole cohort is patched so the graph
# resolves from a single source (librocksdb-sys's `links = "rocksdb"` forbids
# two zebra-state instances). Drop this patch once the fix ships in a
# zebra-rpc release.
zebra-chain = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
zebra-consensus = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
zebra-network = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
zebra-node-services = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
zebra-rpc = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
zebra-script = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
zebra-state = { git = "https://github.com/pacu/zebra.git", rev = "487e6f9312b60bcd3007a7c17c942b1d481a93e6" }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tokio_unstable)',
    'cfg(zallet_build, values("merchant_terminal", "wallet"))',
    'cfg(zcash_unstable, values("nu7"))',
] }
