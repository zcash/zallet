name: Lints

on:
  pull_request:
  push:
    branches: main
  merge_group:

permissions: {}

# Cancel superseded runs: a fresh push to a PR aborts the PR's in-flight run.
# `main` pushes are never cancelled, so every landed commit is fully tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Documentation-only pull requests skip the Rust, Dockerfile and shell lints
  # below and run the book build instead; see changes.yml for what counts as
  # documentation and how the gate stays green.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read

  clippy:
    name: Clippy (MSRV)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Each chain backend lives in its own workspace (zcash/zallet#540), so each is
      # linted separately alongside the shared zallet-core workspace.
      - name: Run clippy (zallet-core)
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: >
            --workspace
            --features zcashd-import,rpc-cli,tokio-console
            --all-targets
          args: >
            -D warnings
      - name: Run clippy (zaino backend)
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: >
            --manifest-path backends/zaino/Cargo.toml
            --features zcashd-import,rpc-cli,tokio-console
            --all-targets
          args: >
            -D warnings
      - name: Run clippy (zebra-state backend)
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: >
            --manifest-path backends/zebra/Cargo.toml
            --features zcashd-import,rpc-cli,tokio-console
            --all-targets
          args: >
            -D warnings

  clippy-beta:
    name: Clippy (beta)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4711ae3e97dd6376c8d5d5d51c89566406abaefa # beta
        id: toolchain
        with:
          components: clippy
      - run: rustup override set "${TOOLCHAIN}"
        shell: sh
        env:
          TOOLCHAIN: ${{steps.toolchain.outputs.name}}
      - name: Run Clippy (beta, zallet-core)
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: >
            --workspace
            --features zcashd-import,rpc-cli,tokio-console
            --all-targets
          args: >
            -W clippy::all
      - name: Run Clippy (beta, zaino backend)
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: >
            --manifest-path backends/zaino/Cargo.toml
            --features zcashd-import,rpc-cli,tokio-console
            --all-targets
          args: >
            -W clippy::all
      - name: Run Clippy (beta, zebra-state backend)
        uses: auguwu/clippy-action@94a9ff2f6920180b89e5c03d121d0af04a9d3e03 # 1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: >
            --manifest-path backends/zebra/Cargo.toml
            --features zcashd-import,rpc-cli,tokio-console
            --all-targets
          args: >
            -W clippy::all

  doc-links:
    name: Intra-doc links
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: cargo fetch
      - run: cargo fetch --manifest-path backends/zebra/Cargo.toml
      - run: cargo fetch --manifest-path backends/zaino/Cargo.toml
      # Requires #![deny(rustdoc::broken_intra_doc_links)] in crates.
      - name: Check intra-doc links (zallet-core)
        run: >
          cargo doc
          --all
          --document-private-items
      - name: Check intra-doc links (zebra-state backend)
        run: >
          cargo doc
          --manifest-path backends/zebra/Cargo.toml
          --document-private-items
      - name: Check intra-doc links (zaino backend)
        run: >
          cargo doc
          --manifest-path backends/zaino/Cargo.toml
          --document-private-items

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check formatting (zebra-state backend)
        run: cargo fmt --manifest-path backends/zebra/Cargo.toml -- --check
      - name: Check formatting (zaino backend)
        run: cargo fmt --manifest-path backends/zaino/Cargo.toml -- --check

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - Dockerfile.stagex
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  shellcheck:
    name: Shellcheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  # The book is otherwise only built when it is deployed from `main`
  # (book.yml), so a broken include or preprocessor directive in a pull
  # request would first surface at deploy time. This installs mdBook the same
  # way book.yml does, so what passes here is what gets deployed.
  book:
    name: Book
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install latest mdbook
        run: |
          tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL "$url" | tar -xz --directory=./mdbook
          echo "$(pwd)/mdbook" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build book

  required-lints:
    name: Required lints have passed
    needs:
      - changes
      - clippy
      - doc-links
      - fmt
      - hadolint
      - shellcheck
      - book
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # A job skipped by the change-detection gate counts as passed; `changes`
      # is itself a dependency so that its failure cannot be mistaken for a
      # documentation-only pull request.
      - name: Determine whether all required-pass steps succeeded or were skipped
        run: |
          echo "${NEEDS}" | jq -e '[ .[] | .result == "success" or .result == "skipped" ] | all'
        env:
          NEEDS: ${{ toJSON(needs) }}
