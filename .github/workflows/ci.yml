name: CI

on:
  pull_request:
  push:
    branches: main

permissions: {}

# Cancel superseded runs: a fresh push to a PR aborts the PR's in-flight run.
# `main` pushes are never cancelled, so every landed commit is fully tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Documentation-only pull requests skip the build and test jobs below; see
  # changes.yml for what counts as documentation and how the gate stays green.
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read

  test-msrv-required:
    name: Test ${{ matrix.state }} on ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target:
          - Linux
        state:
          - default

        include:
          - target: Linux
            os: ubuntu-latest

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      RUSTDOCFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Each chain backend lives in its own workspace with its own lockfile
      # (zcash/zallet#540), so each is tested separately alongside the shared
      # zallet-core workspace.
      #
      # The lockfiles may deliberately diverge on the zebra-* trees, but crates
      # touching the shared wallet database must stay in lockstep.
      - name: Check wallet-critical dependency lockstep
        run: ./utils/check-lockstep.sh
      # Exercise the lockfile-sync helper end to end: it regenerates every
      # workspace lockfile from its manifest, so on an in-lockstep tree it must be
      # a no-op. A non-empty diff means the committed lockfiles drifted from what
      # the manifests resolve to.
      - name: Verify workspace lockfiles are in sync with the manifests
        run: |
          ./utils/sync-lockfiles.sh
          git diff --exit-code
      - name: Run tests (zallet-core)
        run: >
          cargo test
          --workspace
          --features zcashd-import,rpc-cli,tokio-console
      - name: Run tests (zebra-state backend)
        run: >
          cargo test
          --manifest-path backends/zebra/Cargo.toml
          --features zcashd-import,rpc-cli,tokio-console
      # End-to-end check of the `zallet` launcher: config-driven dispatch to the
      # backend binaries, and the backend binaries' own backend-key validation.
      - name: Launcher dispatch smoke test
        run: |
          cargo build --bin zallet
          cargo build --manifest-path backends/zebra/Cargo.toml --bin zallet-zebra
          bindir="$(mktemp -d)"
          datadir="$(mktemp -d)"
          cp target/debug/zallet "$bindir/"
          cp backends/zebra/target/debug/zallet-zebra "$bindir/"

          # No config file: the launcher dispatches to the default (zebra-state)
          # backend, passing arguments through.
          "$bindir/zallet" --datadir "$datadir" --version

          # Generate a real config through the launcher (also exercises subcommand
          # and flag passthrough), then point it at a backend that is not
          # installed. The key must be prepended: top-level TOML keys precede the
          # first [section] header.
          "$bindir/zallet" --datadir "$datadir" example-config \
            -o "$datadir/zallet.toml" \
            --this-is-beta-code-and-you-will-need-to-recreate-the-example-later
          sed -i '1i backend = "absent"' "$datadir/zallet.toml"

          # backend = "absent" maps to a zallet-absent binary: with no such
          # binary, the launcher must fail and name what it looked for.
          if out=$("$bindir/zallet" --datadir "$datadir" --version 2>&1); then
            echo "expected dispatch to a missing zallet-absent to fail"; exit 1
          fi
          echo "$out" | grep -q "zallet-absent" || { echo "error did not name zallet-absent: $out"; exit 1; }

          # Install the zebra binary under that name. The launcher now dispatches
          # to it, and the binary refuses a config that names a backend other
          # than the one it provides.
          cp backends/zebra/target/debug/zallet-zebra "$bindir/zallet-absent"
          if out=$("$bindir/zallet" --datadir "$datadir" example-config -o - \
            --this-is-beta-code-and-you-will-need-to-recreate-the-example-later 2>&1); then
            echo "expected the dispatched binary to reject a backend=absent config"; exit 1
          fi
          echo "$out" | grep -q "provides the 'zebra' backend" \
            || { echo "unexpected mismatch error: $out"; exit 1; }

          # Belt-and-braces: the backend binary invoked directly against the same
          # config also refuses to run.
          if out=$("$bindir/zallet-zebra" --datadir "$datadir" example-config -o - \
            --this-is-beta-code-and-you-will-need-to-recreate-the-example-later 2>&1); then
            echo "expected zallet-zebra to reject a backend=absent config"; exit 1
          fi
          echo "$out" | grep -q "provides the 'zebra' backend" \
            || { echo "unexpected mismatch error: $out"; exit 1; }
      - name: Verify working directory is clean
        run: git diff --exit-code

  test-msrv:
    name: Test ${{ matrix.state }} on ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        target:
          - macOS
          - Windows
        state:
          - default
          - NU7

        include:
          - target: macOS
            os: macOS-latest
          - target: Windows
            os: windows-latest

          - target: Linux
            state: NU7
            os: ubuntu-latest
            rustflags: '--cfg zcash_unstable="nu7"'

          - target: Linux
            state: merchant_terminal
            os: ubuntu-latest
            rustflags: '--cfg zallet_build="merchant_terminal"'

        exclude:
          - target: macOS
            state: NU7

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      RUSTDOCFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Cross-platform / NU7 / merchant_terminal coverage tracks zallet-core; the
      # `zebra-state` backend is Linux-only and covered by `test-msrv-required`.
      - name: Run tests (zallet-core)
        run: >
          cargo test
          --workspace
          --features zcashd-import,rpc-cli,tokio-console
      - name: Verify working directory is clean
        run: git diff --exit-code

  build-latest:
    name: Latest build on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        id: toolchain
      - run: rustup override set ${RUST_TOOLCHAIN}
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{steps.toolchain.outputs.name}}
      - name: Remove lockfiles to build with latest dependencies
        # Multi-path rm requires bash: the Windows default shell (pwsh) aliases
        # `rm` to Remove-Item, which rejects multiple positional paths.
        shell: bash
        run: rm Cargo.lock backends/zebra/Cargo.lock
      - name: Build crates (zallet-core)
        run: >
          cargo build
          --workspace
          --all-targets
          --features zcashd-import,rpc-cli,tokio-console
      - name: Build crates (zebra-state backend)
        if: runner.os == 'Linux'
        run: >
          cargo build
          --manifest-path backends/zebra/Cargo.toml
          --all-targets
          --features zcashd-import,rpc-cli,tokio-console
      - name: Verify working directory is clean (excluding lockfiles)
        # The `--` is load-bearing: the deleted lockfiles are not regenerated on
        # platforms that skip a backend build, and git fatals on a pathspec for
        # a nonexistent path unless the paths are `--`-separated.
        run: git diff --exit-code -- ':!Cargo.lock' ':!backends/zebra/Cargo.lock'

  required-checks:
    name: Required status checks have passed
    needs:
      - changes
      - test-msrv-required
      - build-latest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # A job skipped by the change-detection gate counts as passed; `changes`
      # is itself a dependency so that its failure cannot be mistaken for a
      # documentation-only pull request.
      - name: Determine whether all required-pass steps succeeded or were skipped
        run: |
          echo "${NEEDS}" | jq -e '[ .[] | .result == "success" or .result == "skipped" ] | all'
        env:
          NEEDS: ${{ toJSON(needs) }}
