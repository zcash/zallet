name: Build, attest, and sign standalone binaries plus Debian packages

on:
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.3)"
        required: true
        type: string
      git-sha:
        description: "Source commit SHA"
        required: true
        type: string
      oci-artifact-name:
        description: "Name of the exported binaries artifact to consume"
        required: true
        type: string
      source-image-ref:
        description: "Full Docker image reference (e.g. docker.io/org/image)"
        required: true
        type: string
      source-image-digest:
        description: "Content digest of the source Docker image (sha256:...)"
        required: true
        type: string
      platforms:
        description: "Comma- or newline-separated list of linux/ARCH platforms to package"
        required: true
        type: string
      smoke-distro:
        description: "Debian release used for binary/package smoke tests"
        required: true
        type: string
      apt-distributions:
        description: "Comma- or newline-separated Debian distributions to mirror/publish to apt.z.cash"
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_APT_BUCKET:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.3)"
        required: true
        type: string
      git-sha:
        description: "Source commit SHA"
        required: true
        type: string
      oci-artifact-name:
        description: "Name of the exported binaries artifact to consume"
        required: true
        type: string
      source-image-ref:
        description: "Full Docker image reference (e.g. docker.io/org/image)"
        required: true
        type: string
      source-image-digest:
        description: "Content digest of the source Docker image (sha256:...)"
        required: true
        type: string
      platforms:
        description: "Comma- or newline-separated list of linux/ARCH platforms to package"
        required: false
        default: linux/amd64
        type: string
      smoke-distro:
        description: "Debian release used for binary/package smoke tests"
        required: false
        default: bookworm
        type: string
      apt-distributions:
        description: "Comma- or newline-separated Debian distributions to mirror/publish to apt.z.cash"
        required: false
        default: bullseye,bookworm,trixie
        type: string

permissions:
  contents: read

# Prevent concurrent runs for the same tag from racing (e.g., re-runs)
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  platform_matrix:
    name: Determine platform matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - id: compute
        env:
          PLATFORM_SPEC: ${{ inputs.platforms || 'linux/amd64' }}
          MATRIX_DEBIAN: ${{ inputs['smoke-distro'] || 'bookworm' }}
        run: |
          set -euo pipefail
          MATRIX_JSON=$(
          python3 << 'PY'
          import json
          import os

          raw = os.environ.get("PLATFORM_SPEC", "").replace("\r", "")
          debian_fallback = os.environ.get("MATRIX_DEBIAN", "bookworm").strip() or "bookworm"

          tokens = [tok.strip() for tok in raw.replace("\n", ",").split(",") if tok.strip()]
          if not tokens:
              raise SystemExit("Platform list cannot be empty")

          arch_map = {
              "amd64": {
                  "arch": "amd64",
                  "target": "x86_64-unknown-linux-musl",
                  "suffix": "linux-amd64",
              },
              "arm64": {
                  "arch": "arm64",
                  "target": "aarch64-unknown-linux-musl",
                  "suffix": "linux-arm64",
              },
          }

          entries = []
          for platform in tokens:
              parts = platform.split("/")
              if len(parts) != 2 or parts[0] != "linux":
                  raise SystemExit(f"Unsupported platform '{platform}'")
              arch = parts[1]
              if arch not in arch_map:
                  raise SystemExit(f"Unsupported architecture '{arch}' in platform '{platform}'")
              mapping = arch_map[arch]
              entries.append({
                  "platform": platform,
                  "platform_key": platform.replace("/", "-"),
                  "arch": mapping["arch"],
                  "target": mapping["target"],
                  "binary_suffix": mapping["suffix"],
                  "debian": debian_fallback,
              })

          print(json.dumps(entries))
          PY
          )
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  binaries_deb_release:
    name: Build and deploy Zallet ${{ matrix.platform_key }} binaries and packages
    runs-on: ubuntu-latest
    needs: platform_matrix

    # This job runs repository-controlled packaging inputs (`cargo deb` reads
    # zallet/Cargo.toml's Debian metadata, and the toolchain and cargo-deb are
    # installed here), so it gets no signing key, no AWS credentials, and no
    # OIDC token (which could be exchanged for the AWS role that reads the key).
    # It only produces the unsigned artifacts and their digests; attestation
    # and signing happen in `sign_artifacts`.
    permissions:
      contents: read

    # Each leg sets only its own architecture's output; the other stays empty,
    # so the merged matrix outputs carry one digest list per architecture.
    outputs:
      digests-amd64: ${{ steps.digests.outputs.digests-amd64 }}
      digests-arm64: ${{ steps.digests.outputs.digests-arm64 }}

    strategy:
      matrix:
        include: ${{ fromJson(needs.platform_matrix.outputs.matrix) }}

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.git-sha }}
      OCI_ARTIFACT_NAME: ${{ inputs.oci-artifact-name }}
      SOURCE_IMAGE_REF: ${{ inputs.source-image-ref }}
      SOURCE_IMAGE_DIGEST: ${{ inputs.source-image-digest }}
      SMOKE_TEST_DISTRO: ${{ inputs.smoke-distro }}
      APT_DISTRIBUTIONS: ${{ inputs.apt-distributions }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            aptly \
            make \
            python3 \
            lsb-release \
            apt-transport-https \
            ca-certificates \
            gnupg \
            curl \
            wget

      - name: Install cargo-deb
        # Pin cargo-deb: the floating latest (3.7.0) bumped its MSRV past the
        # runner's stable toolchain and fails to compile with
        # "error[E0658]: `let` expressions in this position are unstable".
        # 2.x has a stable MSRV and the same `--no-build` interface we use.
        # --locked builds against cargo-deb's own lockfile (reproducible deps).
        run: cargo install cargo-deb --version "=2.10.0" --locked

      # The amd64 and arm64 build jobs each upload a distinct per-arch artifact
      # (`<name>-amd64`, `<name>-arm64`) because v4+ artifacts are immutable and
      # same-name uploads don't merge. Pull BOTH with a pattern + merge-multiple
      # so build/runtime-artifact/ contains linux-amd64/ AND linux-arm64/, and
      # this matrix leg can find its own ${platform_key}/zallet.
      - name: Download exported binaries artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: ${{ env.OCI_ARTIFACT_NAME }}-*
          merge-multiple: true
          path: build/runtime-artifact

      - name: Prepare Debian distribution list
        run: |
          set -euo pipefail
          mkdir -p build
          python3 <<'PY' > build/apt-dists.txt
          import os

          raw = os.environ.get("APT_DISTRIBUTIONS", "")
          parts = [p.strip() for p in raw.replace("\r", "").replace("\n", ",").split(",") if p.strip()]
          if not parts:
              raise SystemExit("APT_DISTRIBUTIONS cannot be empty")
          for part in parts:
              print(part)
          PY
          echo "Will operate on distributions:"
          cat build/apt-dists.txt

      - name: Stage exported binaries
        run: |
          set -euo pipefail

          PLATFORM_KEY="${{ matrix.platform_key }}"
          ARTIFACT_ROOT="build/runtime-artifact/${PLATFORM_KEY}"

          # Basic sanity check: the export image carries two binaries at its
          # root (zcash/zallet#540): /zallet is the launcher, and /zallet-zebra
          # is the real backend binary.
          for bin in zallet zallet-zebra; do
            if [[ ! -s "${ARTIFACT_ROOT}/${bin}" ]]; then
              echo "Missing ${bin} binary under ${ARTIFACT_ROOT}" >&2
              find "${ARTIFACT_ROOT}" -maxdepth 5 || true
              exit 1
            fi
          done

          # Prepare per-platform staging directory (including /usr/local for rsync)
          mkdir -p "build/${PLATFORM_KEY}/usr/local"

          # Store the binaries in a stable place for later steps (standalone
          # binary + .deb staging both read them from here), and force
          # executable perms.
          install -m 0755 "${ARTIFACT_ROOT}/zallet"             "build/${PLATFORM_KEY}/zallet"
          install -m 0755 "${ARTIFACT_ROOT}/zallet-zebra" "build/${PLATFORM_KEY}/zallet-zebra"

          # Copy the usr/local tree as-is (completions, manpages, docs, etc.)
          # If there is no usr/local in the artifact, this won't fail because of '|| true'
          rsync -a "${ARTIFACT_ROOT}/usr/local/" "build/${PLATFORM_KEY}/usr/local/" 2>/dev/null || true

      # The deb matrix runs on amd64 runners, but the smoke test execs the
      # per-arch binary inside a `--platform ${{ matrix.platform }}` container.
      # For the arm64 leg that needs QEMU binfmt registered, or the exec fails
      # with "exec /usr/local/bin/zallet: exec format error". Registering QEMU
      # is a no-op for the native amd64 leg.
      - name: Set up QEMU (emulate the non-native arch for the smoke test)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: ${{ matrix.platform }}

      - name: Smoke test exported binaries
        run: |
          set -euo pipefail
          # Mount the launcher next to the zebra-state backend so `zallet -h`
          # exercises real launcher dispatch.
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/build/${{ matrix.platform_key }}/zallet":/usr/local/bin/zallet:ro \
            -v "$PWD/build/${{ matrix.platform_key }}/zallet-zebra":/usr/local/bin/zallet-zebra:ro \
            "debian:${SMOKE_TEST_DISTRO}-slim" \
            /usr/local/bin/zallet -h

      - name: Prepare standalone release tarball
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          set -euo pipefail
          # Ship both binaries (launcher + real backend) in ONE self-sufficient
          # tarball per platform, mirroring the .deb's layout (zcash/zallet#540)
          # instead of loose files. Preserves relative
          # perms/paths so `tar -xzf ... && ./zallet -h` works out of the box.
          STAGE="tarball/zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}"
          mkdir -p "$STAGE"
          cp "build/${PLATFORM_KEY}/zallet"        "$STAGE/zallet"
          cp "build/${PLATFORM_KEY}/zallet-zebra"  "$STAGE/zallet-zebra"
          chmod 0755 "$STAGE"/zallet*
          mkdir -p standalone
          # Deterministic tarball: fixed mtime/owner so the .tar.gz digest
          # doesn't depend on filesystem timestamps from this runner.
          tar -C tarball --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='@0' \
            -czf "standalone/zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz" \
            "zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}"

      - name: Generate provenance chain metadata
        env:
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          TARBALL_PATH="standalone/zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz"
          TARBALL_SHA256=$(sha256sum "$TARBALL_PATH" | cut -d' ' -f1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "standalone/zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz.provenance.json" <<EOF
          {
            "version": "1.0",
            "subject": {
              "name": "zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz",
              "sha256": "${TARBALL_SHA256}",
              "contains": ["zallet", "zallet-zebra"]
            },
            "source": {
              "image_ref": "${SOURCE_IMAGE_REF}",
              "image_digest": "${SOURCE_IMAGE_DIGEST}",
              "git_sha": "${RELEASE_SHA}",
              "git_ref": "${RELEASE_VERSION}"
            },
            "extraction": {
              "workflow": "${GH_WORKFLOW}",
              "run_id": "${GH_RUN_ID}",
              "run_attempt": "${GH_RUN_ATTEMPT}",
              "runner_os": "${GH_RUNNER_OS}",
              "timestamp": "${TIMESTAMP}"
            },
            "verification": {
              "docker_image_attestation": "${SOURCE_IMAGE_REF}@${SOURCE_IMAGE_DIGEST}",
              "note": "This tarball's binaries were extracted from the Docker image above. Verify the image attestation for full build provenance."
            }
          }
          EOF

      - name: Generate SPDX SBOM for standalone tarball
        env:
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          python3 <<'PY'
          import hashlib
          import os
          from pathlib import Path

          tarball_path = Path(f"standalone/zallet-{os.environ['RELEASE_VERSION']}-{os.environ['BINARY_SUFFIX']}.tar.gz")
          if not tarball_path.exists():
              raise SystemExit(f"Missing tarball at {tarball_path}")
          checksum = hashlib.sha256(tarball_path.read_bytes()).hexdigest()
          output = tarball_path.parent / f"{tarball_path.name}.sbom.spdx"
          doc = f"""SPDXVersion: SPDX-2.3
          DataLicense: CC0-1.0
          SPDXID: SPDXRef-DOCUMENT
          DocumentName: {tarball_path.name}
          DocumentNamespace: https://github.com/{os.environ['GITHUB_REPOSITORY']}/sbom/{tarball_path.name}-{checksum}
          Creator: Tool: zallet-ci-spdx-1.0
          Created: 1970-01-01T00:00:00Z
          PackageName: {tarball_path.name}
          PackageSPDXID: SPDXRef-Package-{checksum[:12]}
          PackageDownloadLocation: NOASSERTION
          FilesAnalyzed: false
          PackageChecksum: SHA256: {checksum}
          # Contains: zallet (launcher), zallet-zebra
          """
          output.write_text(doc, encoding="utf-8")
          PY

      - name: Seed cargo target tree with the imported artifacts
        run: |
          set -euo pipefail

          PLATFORM_KEY="${{ matrix.platform_key }}"
          TARGET_TRIPLE="${{ matrix.target }}"

          # Root where the export stage stored all Zallet assets under /usr/local/share/zallet
          ROOT="build/${PLATFORM_KEY}/usr/local/share/zallet"

          TARGET_DIR="target/${TARGET_TRIPLE}/release"
          COMPLETIONS_DIR="${TARGET_DIR}/completions"
          MANPAGES_DIR="${TARGET_DIR}/manpages"

          mkdir -p "${TARGET_DIR}" "${COMPLETIONS_DIR}" "${MANPAGES_DIR}"

          # Seed the launcher and the real backend binary for cargo-deb
          # --no-build: the `zallet` package installs `zallet` = the launcher
          # plus the backend binary it dispatches to (zcash/zallet#540;
          # the pre-split zallet-zebra *symlink* is obsolete — it is a
          # real binary now).
          install -m 0755 "build/${PLATFORM_KEY}/zallet"             "${TARGET_DIR}/zallet"
          install -m 0755 "build/${PLATFORM_KEY}/zallet-zebra" "${TARGET_DIR}/zallet-zebra"

          # Copy the whole completions tree (whatever is inside)
          cp -a "${ROOT}/completions/." "${COMPLETIONS_DIR}/" 2>/dev/null || true

          # Copy the whole manpages tree
          cp -a "${ROOT}/manpages/." "${MANPAGES_DIR}/" 2>/dev/null || true

          # Copy Debian copyright metadata. The license inventory is generated
          # by gen-copyright on the amd64 StageX path only; it is the union of
          # both shipped binaries' dependency graphs and arch-independent,
          # so the arm64 (Nix-built) leg reuses the amd64 artifact's copy.
          if [[ -f "${ROOT}/debian-copyright" ]]; then
            install -m 0644 "${ROOT}/debian-copyright" "${TARGET_DIR}/debian-copyright"
          else
            AMD64_COPYRIGHT="build/linux-amd64/usr/local/share/zallet/debian-copyright"
            if [[ ! -f "${AMD64_COPYRIGHT}" ]]; then
              AMD64_COPYRIGHT="build/runtime-artifact/linux-amd64/usr/local/share/zallet/debian-copyright"
            fi
            install -m 0644 "${AMD64_COPYRIGHT}" "${TARGET_DIR}/debian-copyright"
          fi


      - name: Build package (cargo deb --no-build)
        run: |
          set -euo pipefail
          # The deb matrix runs on amd64 runners. cargo-deb honours the crate's
          # `separate-debug-symbols = true`, which shells out to `strip`. The host
          # (amd64) `strip` can't process the cross-arch (arm64) ELF and fails with
          # "Unable to strip binary ... strip: exit status: 1". Install the
          # target's binutils and point cargo-deb's strip at it via $STRIP so the
          # debug-symbol split works for BOTH arches (no behaviour change vs the
          # amd64-only pipeline).
          case "${{ matrix.target }}" in
            aarch64-*) sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
                       export STRIP=aarch64-linux-gnu-strip OBJCOPY=aarch64-linux-gnu-objcopy ;;
          esac
          # -p zallet: the root workspace has several packages since the
          # backend-workspace split; the deb metadata lives on the launcher.
          cargo deb --no-build --target ${{ matrix.target }} -p zallet

      - name: Rename package to not collide across the matrix
        run: |
          set -euo pipefail
          # cargo-deb writes under target/<triple>/debian/ when --target is used
          # (not the bare target/debian/). Search the whole target tree for the
          # .deb. NOTE: `find` over a path that doesn't exist (e.g. target/debian
          # when --target was used) exits non-zero, and `set -euo pipefail` would
          # then abort on the command substitution BEFORE we inspect $DEB — so
          # search only `target` (always exists) and prune for the .deb. `|| true`
          # guards the pipeline regardless.
          DEB="$(find target -type f -name 'zallet_*.deb' 2>/dev/null | head -1 || true)"
          if [ -z "$DEB" ]; then echo "no .deb produced by cargo-deb" >&2; find target -name '*.deb' 2>/dev/null || true; exit 1; fi
          echo "found deb: $DEB"
          mv "$DEB" "zallet_${RELEASE_VERSION}_${{ matrix.arch }}.deb"

      - name: Smoke test Debian package
        run: |
          set -euo pipefail
          mkdir -p smoke
          cp "zallet_${RELEASE_VERSION}_${{ matrix.arch }}.deb" smoke/package.deb
          # The binaries are static musl builds, which is why one Debian release
          # stands in for every distribution the package is published to. A
          # shared-library dependency would break that, so fail on any Depends.
          DEPENDS="$(dpkg-deb --field smoke/package.deb Depends)"
          if [ -n "${DEPENDS}" ]; then
            echo "::error::package declares Depends: ${DEPENDS}; the binaries are expected to be static"
            exit 1
          fi
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/smoke":/release:ro \
            "debian:${SMOKE_TEST_DISTRO}-slim" \
            bash -euo pipefail -c "\
              apt-get update >/dev/null; \
              apt-get install -y --no-install-recommends ca-certificates >/dev/null; \
              { dpkg -i /release/package.deb || apt-get -f install -y >/dev/null; }; \
              dpkg -s zallet >/dev/null; \
              zallet -h >/dev/null"

      # NOTE: APT index publishing (aptly mirror/snapshot/publish + S3 sync) was
      # MOVED OUT of this per-arch matrix into the single `apt_publish` job below.
      # Reason: when the matrix runs amd64 + arm64 in parallel, each job would
      # regenerate dists/ (the signed APT index) seeing only its OWN arch and
      # race to S3 sync it — leaving the published index listing just one
      # architecture. A single downstream job that ingests BOTH .debs and
      # publishes with `-architectures=amd64,arm64` produces a consistent index.
      # Here the matrix only builds, smoke-tests, and uploads its unsigned .deb;
      # `sign_artifacts` attests and signs it.

      - name: Generate provenance chain metadata for .deb
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          DEB_PATH="zallet_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb"
          DEB_SHA256=$(sha256sum "$DEB_PATH" | cut -d' ' -f1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "${DEB_PATH}.provenance.json" <<EOF
          {
            "version": "1.0",
            "subject": {
              "name": "zallet_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb",
              "sha256": "${DEB_SHA256}"
            },
            "source": {
              "image_ref": "${SOURCE_IMAGE_REF}",
              "image_digest": "${SOURCE_IMAGE_DIGEST}",
              "git_sha": "${RELEASE_SHA}",
              "git_ref": "${RELEASE_VERSION}"
            },
            "extraction": {
              "workflow": "${GH_WORKFLOW}",
              "run_id": "${GH_RUN_ID}",
              "run_attempt": "${GH_RUN_ATTEMPT}",
              "runner_os": "${GH_RUNNER_OS}",
              "timestamp": "${TIMESTAMP}"
            },
            "verification": {
              "docker_image_attestation": "${SOURCE_IMAGE_REF}@${SOURCE_IMAGE_DIGEST}",
              "note": "This package was built from binaries extracted from the Docker image above. Verify the image attestation for full build provenance."
            }
          }
          EOF

      - name: Generate SPDX SBOM for Debian package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          python3 <<'PY'
          import hashlib
          import os
          from pathlib import Path

          package_path = Path(f"zallet_{os.environ['RELEASE_VERSION']}_{os.environ['PACKAGE_ARCH']}.deb")
          if not package_path.exists():
              raise SystemExit(f"Missing package at {package_path}")
          checksum = hashlib.sha256(package_path.read_bytes()).hexdigest()
          output = package_path.parent / f"{package_path.name}.sbom.spdx"
          doc = f"""SPDXVersion: SPDX-2.3
          DataLicense: CC0-1.0
          SPDXID: SPDXRef-DOCUMENT
          DocumentName: {package_path.name}
          DocumentNamespace: https://github.com/{os.environ['GITHUB_REPOSITORY']}/sbom/{package_path.name}-{checksum}
          Creator: Tool: zallet-ci-spdx-1.0
          Created: 1970-01-01T00:00:00Z
          PackageName: {package_path.name}
          PackageSPDXID: SPDXRef-Package-{checksum[:12]}
          PackageDownloadLocation: NOASSERTION
          FilesAnalyzed: false
          PackageChecksum: SHA256: {checksum}
          """
          output.write_text(doc, encoding="utf-8")
          PY

      - name: Collect unsigned deliverables
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          DEST="unsigned/${PLATFORM_KEY}"
          DEB="zallet_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb"
          mkdir -p "$DEST"
          cp standalone/* "$DEST"/
          cp -- "${DEB}" "${DEB}.sbom.spdx" "${DEB}.provenance.json" "$DEST/"

      # `sign_artifacts` refuses to attest or sign anything that does not match
      # this list exactly (same file set, same SHA-256), so a file changed or
      # added between this job and that one is never signed.
      - name: Record artifact digests
        id: digests
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "digests-${PACKAGE_ARCH}<<ZALLET_DIGESTS_EOF"
            (cd "unsigned/${PLATFORM_KEY}" && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum --)
            echo "ZALLET_DIGESTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned artifacts for the signing job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unsigned-${{ matrix.platform_key }}
          path: unsigned/${{ matrix.platform_key }}/*
          if-no-files-found: error

  # Attests and GPG-signs the artifacts built above. This is the only job,
  # besides `apt_publish`, that can read the release signing key, so it runs
  # no repository code: no checkout, no toolchain, no build tools, only
  # GitHub-hosted runner tools (sha256sum, gpg, aws) and SHA-pinned actions.
  # It signs exactly the files whose digests `binaries_deb_release` recorded,
  # and fails closed on any mismatch or unexpected file.
  sign_artifacts:
    name: Attest and sign Zallet ${{ matrix.platform_key }} artifacts
    runs-on: ubuntu-latest
    needs: [platform_matrix, binaries_deb_release]
    # The AWS role that reads the signing key trusts only OIDC tokens issued for
    # this environment, whose deployment policy admits release refs only.
    environment: release

    permissions:
      contents: read
      id-token: write        # OIDC for Sigstore attestation and the AWS role
      attestations: write    # required to persist the attestation

    strategy:
      matrix:
        include: ${{ fromJson(needs.platform_matrix.outputs.matrix) }}

    # As in `binaries_deb_release`, each leg sets only its own architecture's
    # output.
    outputs:
      artifact-id-amd64: ${{ steps.release-id.outputs.artifact-id-amd64 }}
      artifact-id-arm64: ${{ steps.release-id.outputs.artifact-id-arm64 }}

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PLATFORM_KEY: ${{ matrix.platform_key }}
      BINARY_SUFFIX: ${{ matrix.binary_suffix }}
      PACKAGE_ARCH: ${{ matrix.arch }}

    steps:
      - name: Download unsigned artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: unsigned-${{ matrix.platform_key }}
          path: unsigned

      - name: Verify artifacts against the recorded digests
        env:
          DIGESTS_AMD64: ${{ needs.binaries_deb_release.outputs.digests-amd64 }}
          DIGESTS_ARM64: ${{ needs.binaries_deb_release.outputs.digests-arm64 }}
        run: |
          set -euo pipefail
          case "${PACKAGE_ARCH}" in
            amd64) EXPECTED_DIGESTS="${DIGESTS_AMD64}" ;;
            arm64) EXPECTED_DIGESTS="${DIGESTS_ARM64}" ;;
            *) echo "::error::no digest list for architecture ${PACKAGE_ARCH}"; exit 1 ;;
          esac
          cd unsigned

          TARBALL="zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz"
          DEB="zallet_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb"
          printf '%s\n' \
            "${TARBALL}" "${TARBALL}.provenance.json" "${TARBALL}.sbom.spdx" \
            "${DEB}" "${DEB}.provenance.json" "${DEB}.sbom.spdx" \
            | LC_ALL=C sort > "${RUNNER_TEMP}/expected-files"

          # Only regular files, and exactly the expected set.
          if [ -n "$(find . -mindepth 1 ! -type f -print -quit)" ]; then
            echo "::error::unsigned artifact contains a non-regular file"
            find . -mindepth 1 ! -type f
            exit 1
          fi
          find . -mindepth 1 -type f -printf '%P\n' | LC_ALL=C sort > "${RUNNER_TEMP}/actual-files"
          if ! diff -u "${RUNNER_TEMP}/expected-files" "${RUNNER_TEMP}/actual-files"; then
            echo "::error::unsigned artifact file set differs from the expected set"
            exit 1
          fi

          # The digest list from the build job must name exactly the same files,
          # one well-formed `sha256sum` line each, and every digest must match.
          printf '%s\n' "${EXPECTED_DIGESTS}" > "${RUNNER_TEMP}/expected.sha256"
          if grep -Evq '^[0-9a-f]{64}  [A-Za-z0-9._+-]+$' "${RUNNER_TEMP}/expected.sha256"; then
            echo "::error::malformed digest list from binaries_deb_release"
            exit 1
          fi
          if ! cut -d' ' -f3 "${RUNNER_TEMP}/expected.sha256" | LC_ALL=C sort \
              | diff -u "${RUNNER_TEMP}/expected-files" -; then
            echo "::error::digest list does not cover exactly the expected files"
            exit 1
          fi
          sha256sum --check --strict "${RUNNER_TEMP}/expected.sha256"

      - name: Generate build provenance attestation for tarball
        id: binary-attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: unsigned/zallet-${{ env.RELEASE_VERSION }}-${{ matrix.binary_suffix }}.tar.gz

      - name: Generate build provenance attestation for .deb
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: unsigned/zallet_${{ env.RELEASE_VERSION }}_${{ matrix.arch }}.deb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # The key is fetched only here, into a fresh GnuPG home under the runner's
      # temp directory, and removed by the next step whatever the outcome.
      - name: GPG sign tarball and Debian package
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          set -euo pipefail
          mkdir -m 700 -- "${GNUPGHOME}"
          # Pipe directly from Secrets Manager so the key is never written
          # outside the ephemeral GnuPG home.
          aws secretsmanager get-secret-value \
            --secret-id /release/gpg-signing-key \
            --query SecretString \
            --output text | gpg --batch --import
          for f in \
            "unsigned/zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz" \
            "unsigned/zallet_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb"; do
            gpg --batch -u sysadmin@zodl.com --armor --digest-algo SHA256 --detach-sign "$f"
            gpg --batch --verify "$f.asc" "$f"
          done

      - name: Remove signing key material
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          set -uo pipefail
          if [ -e "${GNUPGHOME}" ]; then
            gpgconf --kill all || true
            gpgconf --remove-socketdir || true
            find "${GNUPGHOME}" -type f -exec shred -u -- {} + || true
            rm -rf -- "${GNUPGHOME}"
          fi
          test ! -e "${GNUPGHOME}"

      - name: Collect release deliverables
        env:
          TARBALL_BUNDLE: ${{ steps.binary-attest.outputs['bundle-path'] }}
          DEB_BUNDLE: ${{ steps.attest.outputs['bundle-path'] }}
        run: |
          set -euo pipefail
          TARBALL="zallet-${RELEASE_VERSION}-${BINARY_SUFFIX}.tar.gz"
          DEB="zallet_${RELEASE_VERSION}_${PACKAGE_ARCH}.deb"
          DEST="release/${PLATFORM_KEY}"
          mkdir -p "$DEST"
          for f in \
            "${TARBALL}" "${TARBALL}.asc" "${TARBALL}.provenance.json" "${TARBALL}.sbom.spdx" \
            "${DEB}" "${DEB}.asc" "${DEB}.provenance.json" "${DEB}.sbom.spdx"; do
            cp -- "unsigned/$f" "$DEST/"
          done
          cp -- "$TARBALL_BUNDLE" "$DEST/${TARBALL}.intoto.jsonl"
          cp -- "$DEB_BUNDLE" "$DEST/${DEB}.intoto.jsonl"

      - name: Upload artifacts for publish job
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-${{ matrix.platform_key }}
          path: release/${{ matrix.platform_key }}/*
          if-no-files-found: error

      - name: Record release artifact ID
        id: release-id
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "artifact-id-${PACKAGE_ARCH}=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

  # The downstream jobs fetch the signed artifacts by the IDs `sign_artifacts`
  # returned, not by a name pattern, so an artifact uploaded by any other job
  # of this run (including one running repository code) is never published.
  release_artifacts:
    name: Select signed release artifacts
    runs-on: ubuntu-latest
    needs: [platform_matrix, sign_artifacts]
    outputs:
      ids: ${{ steps.select.outputs.ids }}
    steps:
      - id: select
        env:
          MATRIX: ${{ needs.platform_matrix.outputs.matrix }}
          ID_AMD64: ${{ needs.sign_artifacts.outputs.artifact-id-amd64 }}
          ID_ARM64: ${{ needs.sign_artifacts.outputs.artifact-id-arm64 }}
        run: |
          set -euo pipefail
          ids=()
          while IFS= read -r arch; do
            case "${arch}" in
              amd64) id="${ID_AMD64}" ;;
              arm64) id="${ID_ARM64}" ;;
              *) echo "::error::unexpected architecture ${arch}"; exit 1 ;;
            esac
            if [[ ! "${id}" =~ ^[0-9]+$ ]]; then
              echo "::error::no signed release artifact for ${arch}"
              exit 1
            fi
            ids+=("${id}")
          done < <(jq -r '.[].arch' <<< "${MATRIX}")
          (IFS=,; echo "ids=${ids[*]}") >> "$GITHUB_OUTPUT"

  # Single APT-index publish for ALL architectures. The per-arch matrices only
  # build, sign and upload their .deb (as release-<platform_key> artifacts); this
  # job ingests every arch's .deb, builds ONE merged snapshot per distribution,
  # and publishes it with `-architectures=amd64,arm64` + a single S3 sync — so
  # the signed dists/ index lists BOTH arches consistently (no parallel race).
  apt_publish:
    name: Publish multi-arch APT index
    needs: release_artifacts
    runs-on: ubuntu-latest
    # The AWS role that reads the signing key trusts only OIDC tokens issued for
    # this environment, whose deployment policy admits release refs only.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      APT_DISTRIBUTIONS: ${{ inputs.apt-distributions }}
    steps:
      - name: Download all per-arch release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: debs
          merge-multiple: true
          artifact-ids: ${{ needs.release_artifacts.outputs.ids }}
      - name: Install aptly + tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          # NB: don't apt-install awscli — it was dropped from the Ubuntu 24.04
          # (noble) repos ("Package 'awscli' has no installation candidate"). The
          # GH runner ships AWS CLI v2 preinstalled and configure-aws-credentials
          # (next step) relies on it, so only aptly + gnupg are needed here.
          sudo apt-get install -y --no-install-recommends aptly gnupg
          aws --version
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build distribution list
        run: |
          set -euo pipefail
          echo "${APT_DISTRIBUTIONS}" | tr ',' '\n' | sed '/^$/d' > /tmp/dists.txt
          echo "dists:"; cat /tmp/dists.txt
      # Like `sign_artifacts`, this job runs no repository code. The key lives in
      # an ephemeral GnuPG home only while aptly signs the index, and is removed
      # before the S3 upload.
      - name: Publish merged multi-arch APT index
        env:
          APT_BUCKET: ${{ secrets.AWS_APT_BUCKET }}
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          set -euo pipefail
          # We REGENERATE the index from the .deb pool instead of `aptly mirror`-ing
          # the live repo. Two reasons:
          #   1. aptly's strict parser rejects the existing apt.z.cash Packages with
          #      "malformed stanza syntax" — some historical zcashd entries have
          #      Description continuation lines that don't start with a space (apt &
          #      dpkg tolerate this; aptly does not). Mirroring is therefore fragile.
          #   2. Regenerating from the .deb files reads each package's control data
          #      straight from the archive (always well-formed), producing a clean,
          #      correct Packages — and incidentally repairs those malformed stanzas.
          # We pull the existing pool from S3 and re-add every package so NOTHING is
          # dropped; only the index is rebuilt. Per-suite bucketing (below) keeps
          # stretch/buster packages out of the bullseye/bookworm indices.
          mkdir -p poolcache
          aws s3 sync "s3://${APT_BUCKET}/pool/" poolcache/ --no-progress --exclude '*' --include '*.deb'
          echo "pool debs pulled: $(find poolcache -name '*.deb' | wc -l)"

          mkdir -m 700 -- "${GNUPGHOME}"
          aws secretsmanager get-secret-value --secret-id /release/gpg-signing-key \
            --query SecretString --output text | gpg --batch --import
          key=$(gpg --list-secret-keys --keyid-format=long sysadmin@zodl.com | head -n 2 | grep -v sec | tr -d ' ')

          mapfile -t dists < /tmp/dists.txt
          for dist in "${dists[@]}"; do
            repo="zcash_${dist}"; snap="snap_${dist}"
            aptly repo drop -force "$repo" >/dev/null 2>&1 || true
            aptly repo create --distribution "$dist" --component main "$repo"

            # Existing pool packages for THIS suite only. Suite is encoded in the
            # filename (e.g. zcash-6.11.0-amd64-bookworm.deb, zallet_..._bullseye.deb),
            # matched on a -/_ boundary so 'bullseye' never matches 'bookworm'.
            while IFS= read -r deb; do
              aptly repo add -force-replace "$repo" "$deb" || echo "skip (already present?): $deb"
            done < <(find poolcache -name "*[-_]${dist}.deb")

            # Our NEW zallet .debs (amd64 + arm64) carry no suite suffix — they're
            # static-musl and valid on every suite, so add them to each dist.
            find debs -name 'zallet_*.deb' -exec aptly repo add -force-replace "$repo" {} +

            aptly snapshot drop -force "$snap" >/dev/null 2>&1 || true
            aptly snapshot create "$snap" from repo "$repo"
            # ONE publish per suite with BOTH architectures → consistent dists/ index.
            aptly publish snapshot -architectures=amd64,arm64 -gpg-key="$key" -distribution="$dist" "$snap"
          done
      - name: Remove signing key material
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          set -uo pipefail
          if [ -e "${GNUPGHOME}" ]; then
            gpgconf --kill all || true
            gpgconf --remove-socketdir || true
            find "${GNUPGHOME}" -type f -exec shred -u -- {} + || true
            rm -rf -- "${GNUPGHOME}"
          fi
          test ! -e "${GNUPGHOME}"
      - name: Sync merged index + pool to apt.z.cash (single writer)
        run: |
          set -euo pipefail
          # Sync the FULL published pool (aptly lays out every package the index
          # references — zcash + zallet — under pool/main/z/...). The regenerated
          # dists/ index points at these exact pool paths, so push the whole pool
          # tree to keep index↔pool consistent. No --delete: stretch/buster dists
          # we didn't republish stay untouched in S3.
          aws s3 sync "$HOME/.aptly/public/pool/" "s3://${{ secrets.AWS_APT_BUCKET }}/pool/" --no-progress
          aws s3 sync "$HOME/.aptly/public/dists/" "s3://${{ secrets.AWS_APT_BUCKET }}/dists/" --no-progress

  publish:
    name: Create/Update GitHub Release (aggregate)
    needs: release_artifacts
    if: ${{ startsWith(inputs.version, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts
          merge-multiple: true
          artifact-ids: ${{ needs.release_artifacts.outputs.ids }}

      - name: Publish/Update GitHub Release (incremental)
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          append_body: true
          overwrite_files: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
