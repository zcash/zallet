name: Build and Run Docker Container

# This check is not required by the merge ruleset, so it can simply not run
# on documentation-only pull requests. The exclusions mirror the documentation
# set in changes.yml.
on:
  pull_request:
    paths-ignore:
      - 'book/**'
      - '**.md'
      - 'LICENSE-*'
  push:
    branches: main

permissions: {}

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build -t zallet .

      - name: Run command inside Docker container
        run: |
          docker run --rm zallet -h
